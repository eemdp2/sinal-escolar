<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinal Escolar</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Sinal">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

    <div class="container">
        <h1>Sinal Escolar Automático</h1>

        <div id="relogio">00:00:00</div>

        <button id="btnIniciar">ATIVAR SISTEMA</button>

        <p id="status">Sistema Inativo. Clique em ativar.</p>

        <div class="proximo-toque">
            Próximo sinal: <span id="proxSinal">--:--</span>
        </div>

        <div class="area-testes">
            <h2>Teste dos Sons</h2>

            <button onclick="testarSom('somIntro')">🔔 Testar Sinal</button>

            <hr>

            <p>Testar apenas o áudio:</p>

            <button onclick="testarSom('somA1')">A1</button>
            <button onclick="testarSom('somA2')">A2</button>
            <button onclick="testarSom('somA3')">A3</button>
            <button onclick="testarSom('somA4')">A4</button>
            <button onclick="testarSom('somA5')">A5</button>
            <button onclick="testarSom('somA6')">A6</button>
            <button onclick="testarSom('somA7')">A7</button>
            <button onclick="testarSom('somA8')">A8</button>
            <button onclick="testarSom('somA9')">A9</button>
            <button onclick="testarSom('somFim')">Fim</button>

            <hr>

            <p>Testar sinal + áudio:</p>

            <button onclick="testarSequencia('somA1')">🔔 + A1</button>
            <button onclick="testarSequencia('somA2')">🔔 + A2</button>
            <button onclick="testarSequencia('somA3')">🔔 + A3</button>
            <button onclick="testarSequencia('somA4')">🔔 + A4</button>
            <button onclick="testarSequencia('somA5')">🔔 + A5</button>
            <button onclick="testarSequencia('somA6')">🔔 + A6</button>
            <button onclick="testarSequencia('somA7')">🔔 + A7</button>
            <button onclick="testarSequencia('somA8')">🔔 + A8</button>
            <button onclick="testarSequencia('somA9')">🔔 + A9</button>
            <button onclick="testarSequencia('somFim')">🔔 + Fim</button>

            <hr>

            <button onclick="pararTodos()">⏹ Parar som</button>
        </div>
    </div>

    <audio id="somIntro" src="sons/sinal.mp3"></audio>

    <audio id="somA1" src="sons/a1.mp3"></audio>
    <audio id="somA2" src="sons/a2.mp3"></audio>
    <audio id="somA3" src="sons/a3.mp3"></audio>
    <audio id="somA4" src="sons/a4.mp3"></audio>
    <audio id="somA5" src="sons/a5.mp3"></audio>
    <audio id="somA6" src="sons/a6.mp3"></audio>
    <audio id="somA7" src="sons/a7.mp3"></audio>
    <audio id="somA8" src="sons/a8.mp3"></audio>
    <audio id="somA9" src="sons/a9.mp3"></audio>
    <audio id="somFim" src="sons/fim.mp3"></audio>

    <script src="script.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker Registrado!"))
                .catch(err => console.log("Erro no SW:", err));
        }
    </script>

</body>
</html>
