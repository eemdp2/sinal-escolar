<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinal Escolar - Digital Signage</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sinal">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
       /* Importação de fontes */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background-color: #000;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    height: 100vh;
    overflow: hidden;
}

/* Camada do Vídeo */
.video-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
}

.video-background video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Overlay com gradiente para melhorar a leitura em vídeos claros */
.overlay-digital-signage {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.7) 100%);
    display: flex;
    flex-direction: column;
    justify-content: space-between; /* Espalha o conteúdo (topo e baixo) */
    padding: 60px;
    z-index: 1;
}

/* Cabeçalho */
h1 {
    font-size: 1.5rem;
    text-transform: uppercase;
    letter-spacing: 8px;
    color: rgba(255, 255, 255, 0.6);
    margin: 0;
    text-align: center;
}

/* Área Central: Relógio */
.container {
    text-align: center;
}

#relogio {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(6rem, 25vw, 18rem);
    font-weight: 700;
    line-height: 0.9;
    color: #fff;
    text-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
}

/* Rodapé: Informações do Sinal e Botão */
.footer-info {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    width: 100%;
}

.proximo-toque {
    background: rgba(255, 204, 0, 0.9); /* Fundo amarelo sólido para destaque */
    color: #000;
    padding: 20px 40px;
    border-radius: 15px;
    font-size: 2.5rem;
    font-weight: 700;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

#btnIniciar {
    background-color: #24a148;
    color: white;
    border: none;
    padding: 20px 30px;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
}

#btnIniciar:hover {
    background-color: #2cc056;
    transform: scale(1.1);
}

#status {
    color: #aaa;
    font-size: 0.9rem;
    margin-top: 10px;
}
    </style>
</head>
<body>

    <div class="video-background">
        <video id="videoPlayer" autoplay muted loop playsinline>
            <source src="videos/video1.mp4" type="video/mp4">
            Seu navegador não suporta vídeos.
        </video>
    </div>

    <div class="overlay-digital-signage">
        
        <header>
            <h1>SINAL ESCOLAR AUTOMÁTICO</h1>
        </header>

        <main class="container">
            <div id="relogio">00:00:00</div>
        </main>

        <footer class="footer-info">
            <div class="controles-lado-esquerdo">
                <button id="btnIniciar">ATIVAR SISTEMA</button>
                <p id="status">Sistema Inativo. Clique para permitir áudio.</p>
            </div>

            <div class="proximo-toque">
                PRÓXIMO SINAL: <span id="proxSinal">--:--</span>
            </div>
        </footer>

    </div>

    <audio id="somIntro" src="sons/sinal.mp3"></audio>
    <audio id="somA1" src="sons/a1.mp3"></audio>
    <audio id="somA2" src="sons/a2.mp3"></audio>
    <audio id="somA3" src="sons/a3.mp3"></audio>
    <audio id="somA4" src="sons/a4.mp3"></audio> 
    <audio id="somA5" src="sons/a5.mp3"></audio> 
    <audio id="somA6" src="sons/a6.mp3"></audio> 
    <audio id="somA7" src="sons/a7.mp3"></audio> 
    <audio id="somA8" src="sons/a8.mp3"></audio> 
    <audio id="somA9" src="sons/a9.mp3"></audio> 
    <audio id="somFim" src="sons/fim.mp3"></audio>

    <script src="script.js"></script>
    <script>
        // Registro do Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                .then(reg => console.log("Service Worker ativo:", reg.scope))
                .catch(err => console.log("Erro no Service Worker:", err));
            });
        }

        // Lógica de Playlist de Vídeos (opcional)
        const videoPlayer = document.getElementById('videoPlayer');
        const playlist = [
            'videos/video1.mp4',
            'videos/video2.mp4' // Adicione mais nomes de arquivos aqui se tiver
        ];
        let currentVideoIndex = 0;

        videoPlayer.onended = function() {
            if(playlist.length > 1) {
                currentVideoIndex = (currentVideoIndex + 1) % playlist.length;
                videoPlayer.src = playlist[currentVideoIndex];
                videoPlayer.play();
            }
        };
    </script>
</body>
</html>
