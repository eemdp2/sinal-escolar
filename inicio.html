<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Escolar Digital</title>

    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        body {
            margin: 0;
            background: #0d1117;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;
            grid-template-columns: 3fr 1fr;
            height: 100vh;
        }

        .video {
            background: black;
        }

        .painel {
            background: #161b22;
            padding: 20px;
            text-align: center;
        }

        #relogio {
            font-size: 40px;
            margin: 20px 0;
        }

        #proxSinal {
            font-size: 30px;
            color: #ffcc00;
        }

        button {
            margin: 3px;
            padding: 8px;
            cursor: pointer;
        }

        /* Painel de teste */
        #testeAudio {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: #000;
            padding: 10px;
            border-radius: 8px;
            z-index: 9999;
        }

        #testeAudio p {
            font-size: 12px;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="video">
        <video autoplay muted loop style="width:100%; height:100%;">
            <source src="videos/video1.mp4" type="video/mp4">
        </video>
    </div>

    <div class="painel">
        <h2>SINAL ESCOLAR</h2>

        <div id="relogio">00:00:00</div>

        <p>PRÓXIMO SINAL</p>
        <div id="proxSinal">--:--</div>

        <br>
        <button id="btnIniciar">ATIVAR</button>
        <p id="status">Sistema Inativo</p>
    </div>

</div>

<!-- 🔊 ÁUDIOS -->
<audio id="somIntro" src="sons/sinal.mp3"></audio>
<audio id="somA1" src="sons/a1.mp3"></audio>
<audio id="somA2" src="sons/a2.mp3"></audio>
<audio id="somA3" src="sons/a3.mp3"></audio>
<audio id="somA4" src="sons/a4.mp3"></audio>
<audio id="somA5" src="sons/a5.mp3"></audio>
<audio id="somA6" src="sons/a6.mp3"></audio>
<audio id="somA7" src="sons/a7.mp3"></audio>
<audio id="somA8" src="sons/a8.mp3"></audio>
<audio id="somA9" src="sons/a9.mp3"></audio>
<audio id="somFim" src="sons/fim.mp3"></audio>

<!-- 🔧 BOTÕES DE TESTE -->
<div id="testeAudio">
    <p>TESTE DE SOM</p>
    <button onclick="testarSom('somIntro')">Intro</button>
    <button onclick="testarSom('somA1')">A1</button>
    <button onclick="testarSom('somA2')">A2</button>
    <button onclick="testarSom('somA3')">A3</button>
    <button onclick="testarSom('somA4')">A4</button>
    <button onclick="testarSom('somA5')">A5</button>
    <button onclick="testarSom('somA6')">A6</button>
    <button onclick="testarSom('somA7')">A7</button>
    <button onclick="testarSom('somA8')">A8</button>
    <button onclick="testarSom('somA9')">A9</button>
    <button onclick="testarSom('somFim')">FIM</button>
</div>

<script src="script.js"></script>

<script>
// 🔊 Função de teste
function testarSom(id) {
    const audio = document.getElementById(id);

    if (!audio) {
        alert("Áudio não encontrado: " + id);
        return;
    }

    audio.currentTime = 0;

    audio.play()
        .then(() => console.log("Tocando:", id))
        .catch(err => {
            console.log(err);
            alert("Erro ao tocar: " + id);
        });
}
</script>

<script>
// Service Worker (opcional)
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
    .then(() => console.log("SW ativo"))
    .catch(err => console.log(err));
}
</script>

</body>
</html>
