<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Escolar</title>

<style>
body {
    margin: 0;
    background: #0d1117;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    display: grid;
    grid-template-columns: 3fr 1fr;
    height: 100vh;
}

.video {
    background: black;
}

.painel {
    background: #161b22;
    padding: 20px;
    text-align: center;
}

/* 🔥 RELÓGIO MAIOR */
#relogio {
    font-size: 80px;
    font-weight: bold;
    margin: 20px 0;
}

/* 🔔 TOCANDO AGORA */
#tocandoAgora {
    font-size: 20px;
    color: #00ff88;
    margin: 10px 0;
}

/* ⚡ ALERTA PISCANDO */
.alerta {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 0, 0, 0.7);
    display: none;
    z-index: 9998;
    animation: piscar 0.5s infinite;
}

@keyframes piscar {
    0% {opacity: 0.2;}
    50% {opacity: 1;}
    100% {opacity: 0.2;}
}

#proxSinal {
    font-size: 40px;
    color: #ffcc00;
}

button {
    padding: 10px;
    margin-top: 10px;
}

/* painel teste */
#testeAudio {
    position: fixed;
    bottom: 10px;
    left: 10px;
    background: #000;
    padding: 10px;
    border-radius: 8px;
}
</style>
</head>

<body>

<!-- 🔴 ALERTA -->
<div id="alerta" class="alerta"></div>

<div class="container">

<div class="video">
    <video autoplay muted loop style="width:100%; height:100%;">
        <source src="videos/video1.mp4" type="video/mp4">
    </video>
</div>

<div class="painel">
    <h2>SINAL ESCOLAR</h2>

    <div id="relogio">00:00:00</div>

    <!-- 🔔 TOCANDO AGORA -->
    <div id="tocandoAgora"></div>

    <p>PRÓXIMO SINAL</p>
    <div id="proxSinal">--:--</div>

    <button id="btnIniciar">ATIVAR</button>
    <p id="status">Sistema Inativo</p>
</div>

</div>

<!-- 🔊 ÁUDIOS -->
<audio id="somIntro" src="sons/sinal.mp3"></audio>
<audio id="somA1" src="sons/a1.mp3"></audio>
<audio id="somA2" src="sons/a2.mp3"></audio>
<audio id="somA3" src="sons/a3.mp3"></audio>
<audio id="somA4" src="sons/a4.mp3"></audio>
<audio id="somA5" src="sons/a5.mp3"></audio>
<audio id="somA6" src="sons/a6.mp3"></audio>
<audio id="somA7" src="sons/a7.mp3"></audio>
<audio id="somA8" src="sons/a8.mp3"></audio>
<audio id="somA9" src="sons/a9.mp3"></audio>
<audio id="somFim" src="sons/fim.mp3"></audio>

<script>
const relogio = document.getElementById("relogio");
const tocandoAgora = document.getElementById("tocandoAgora");
const alerta = document.getElementById("alerta");

/* 🕒 RELÓGIO */
setInterval(() => {
    const agora = new Date();
    relogio.innerText = agora.toLocaleTimeString();
}, 1000);

/* 🔊 TOCAR COM ALERTA */
function tocarSom(id) {
    const audio = document.getElementById(id);

    if (!audio) return;

    audio.currentTime = 0;

    // 🔴 alerta visual
    alerta.style.display = "block";

    // 🔔 texto
    tocandoAgora.innerText = "🔔 TOCANDO AGORA";

    audio.play().then(() => {

        // quando terminar
        audio.onended = () => {
            alerta.style.display = "none";
            tocandoAgora.innerText = "";
        };

    }).catch(() => {
        alerta.style.display = "none";
        tocandoAgora.innerText = "Erro ao tocar";
    });
}

/* BOTÃO ATIVAR (desbloqueio) */
document.getElementById("btnIniciar").addEventListener("click", async () => {
    const audios = document.querySelectorAll("audio");

    for (let a of audios) {
        try {
            await a.play();
            a.pause();
            a.currentTime = 0;
        } catch {}
    }

    alert("Sistema ativado!");
});

/* TESTE RÁPIDO */
window.testar = tocarSom;
</script>

<!-- 🔧 TESTE -->
<div id="testeAudio">
    <button onclick="testar('somIntro')">Intro</button>
    <button onclick="testar('somA1')">A1</button>
    <button onclick="testar('somA2')">A2</button>
    <button onclick="testar('somFim')">FIM</button>
</div>

</body>
</html>
